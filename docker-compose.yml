services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_PORT: "8080"
      APP_ENV: production
      DB_DSN: postgres://postgres:Mypass123@host.docker.internal:5432/clickupdb?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      STORAGE_DIR: /app/storage
      MIGRATIONS_DIR: /app/migrations
      AUTO_MIGRATE: "true"
    ports:
      - "8080:8080"
    volumes:
      - backend-storage:/app/storage
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-storage:
